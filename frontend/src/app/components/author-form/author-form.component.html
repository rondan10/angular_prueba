<div class="modal show">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{isEditing ? 'Editar' : 'Nuevo'}} Autor</h3>
      <button class="close" (click)="closeModal.emit()">&times;</button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="onSubmit()" #authorForm="ngForm">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" 
                 class="form-control" 
                 id="nombre" 
                 name="nombre" 
                 [(ngModel)]="formAuthor.nombre" 
                 required>
        </div>

        <div class="form-group">
          <label for="genero">Género</label>
          <select class="form-control" 
                  id="genero" 
                  name="genero" 
                  [(ngModel)]="formAuthor.genero" 
                  required>
            <option value="">Seleccione un género</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal.emit()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="!authorForm.form.valid">
            {{isEditing ? 'Actualizar' : 'Crear'}}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
